<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · Money Planner</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="shared/style.css">
<style>
  .hello { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; margin: 8px 0 18px; }
  .hello h1 { margin: 0; }
  .goal-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .goal-row:last-child { border-bottom: 0; }
  .goal-row .ico { font-size: 1.4rem; grid-row: span 2; }
  .goal-row .progress { grid-column: 2 / 4; }
  .activity { list-style: none; padding: 0; margin: 0; }
  .activity li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  .activity li:last-child { border-bottom: 0; }
  .section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 26px 0 12px; }
  .section-title h2 { margin: 0; }
  .group-title { margin: 18px 0 10px; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile.recommended { border-color: var(--accent); }
  .rec-chip { margin-inline-start: 8px; vertical-align: 2px; }
  .guide-cta { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; border-color: var(--primary); background: var(--primary-soft); }
  #your-plan { margin-bottom: 16px; }
  .home-plan { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
  .home-plan li { display: flex; gap: 12px; align-items: flex-start; }
  .home-plan .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
  .home-plan li.done .n { background: var(--success-soft); color: var(--success); }
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="shared/uk.js"></script>
<script src="shared/glossary.js"></script>
<script src="shared/core.js"></script>
<script src="shared/tools.js"></script>
<script>
MP.page({ id: 'home', title: 'Home' }).then(function () {
  var el = MP.el, main = MP.$('#app');
  var REGIONS = [['england', 'England'], ['wales', 'Wales'], ['scotland', 'Scotland'], ['ni', 'Northern Ireland']];
  var RISK = [['cautious', 'Cautious'], ['balanced', 'Balanced'], ['adventurous', 'Adventurous']];

  function render() {
    var p = MP.profile(), goals = MP.goals(), sums = MP.get('summaries', {});
    main.innerHTML = '';
    var first = (p.name || '').split(' ')[0];
    var hour = new Date().getHours();
    main.appendChild(el('div', { class: 'hello' },
      el('div', null, el('h1', null, (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + ', ' + first),
        el('p', { class: 'muted', style: { margin: 0 } }, 'Your plans are saved securely on this device.')),
      el('a', { class: 'btn btn-accent', href: 'apps/dreams/index.html', id: 'add-dream' }, '＋ Add a dream')));

    main.appendChild(planCard(sums));

    // snapshot
    var totalTarget = goals.reduce(function (a, g) { return a + (+g.target || 0); }, 0);
    var totalSaved = goals.reduce(function (a, g) { return a + Math.min(+g.saved || 0, +g.target || 0); }, 0);
    var monthly = goals.reduce(function (a, g) { return a + (+g.monthly || +g.monthlyNeeded || 0); }, 0);
    var age = p.dob ? UK.age(p.dob) : null;
    main.appendChild(el('div', { class: 'grid-3' },
      stat('Dreams you are saving for', goals.length ? String(goals.length) : 'None yet', 'stat-goals'),
      stat('Saved towards them', MP.money(totalSaved) + (totalTarget ? ' of ' + MP.money(totalTarget) : ''), 'stat-saved'),
      stat('To put aside each month', MP.money(monthly), 'stat-monthly')));

    var split = el('div', { class: 'grid-2', style: { marginTop: '16px' } });
    // goals list
    var gc = el('section', { class: 'card', 'aria-labelledby': 'h-goals' }, el('h2', { id: 'h-goals' }, 'Your dreams'));
    if (!goals.length) gc.appendChild(el('p', { class: 'muted' }, 'Nothing here yet. A home deposit, a wedding, a dream holiday, retiring at 60: add what matters to you and we will work out a plan.'));
    goals.slice().sort(function (a, b) { return (a.priority || 2) - (b.priority || 2); }).slice(0, 6).forEach(function (g) {
      var pc = g.target ? MP.clamp((+g.saved || 0) / g.target, 0, 1) : 0;
      gc.appendChild(el('div', { class: 'goal-row' },
        el('span', { class: 'ico', 'aria-hidden': 'true' }, g.icon || '🎯'),
        el('strong', null, g.name),
        el('span', { class: 'small muted' }, MP.money(g.saved || 0) + ' / ' + MP.money(g.target || 0)),
        el('div', { class: 'progress', role: 'progressbar', 'aria-valuenow': Math.round(pc * 100), 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-label': g.name + ' progress' }, el('span', { style: { width: (pc * 100) + '%' } }))));
    });
    gc.appendChild(el('p', { style: { marginTop: '12px' } }, el('a', { href: 'apps/dreams/index.html' }, goals.length ? 'Manage your dreams →' : 'Add your first dream →')));
    split.appendChild(gc);
    split.appendChild(profileCard(p, age));
    main.appendChild(split);

    // tools, grouped
    var recommended = {}; (MP.prefs().plan || []).forEach(function (x) { recommended[x.tool] = 1; });
    main.appendChild(el('div', { class: 'section-title' }, el('h2', null, 'Planning tools'), MP.detailToggle()));
    var all = el('div', { id: 'tools' });
    var groups = window.MP_GROUPS || [{ id: null, title: '' }];
    groups.forEach(function (gr) {
      var list = MP_TOOLS.filter(function (t) { return !gr.id || t.group === gr.id; });
      if (!list.length) return;
      if (gr.title) all.appendChild(el('h3', { class: 'group-title' }, gr.title));
      var grid = el('div', { class: 'grid' });
      list.forEach(function (t) {
        var s = sums[t.id];
        grid.appendChild(el('a', { class: 'card tile' + (recommended[t.id] ? ' recommended' : ''), href: 'apps/' + t.id + '/index.html', id: 'tool-' + t.id },
          el('span', { class: 'ico', 'aria-hidden': 'true' }, t.icon),
          el('span', null, el('h3', null, t.title, recommended[t.id] ? el('span', { class: 'chip info rec-chip' }, 'For you') : null), el('p', null, t.desc),
            s ? el('div', { class: 'saved' }, '✓ ' + s.text) : null)));
      });
      all.appendChild(grid);
    });
    main.appendChild(all);

    // activity + account
    var bottom = el('div', { class: 'grid-2', style: { marginTop: '16px' } });
    var act = MP.get('activity', []);
    bottom.appendChild(el('section', { class: 'card' }, el('h2', null, 'Recent activity'),
      act.length ? el('ul', { class: 'activity' }, act.slice(0, 8).map(function (a) { return el('li', null, a.text, el('span', { class: 'muted tiny' }, ' · ' + MP.fmtDate(a.at))); }))
        : el('p', { class: 'muted' }, 'Things you save in the tools will show here.')));
    bottom.appendChild(datesCard(p, goals));
    main.appendChild(bottom);
    main.appendChild(el('div', { class: 'grid-2', style: { marginTop: '16px' } }, reportCard(), accountCard()));
  }

  var LABELS = { knowledge: { new: 'New to money matters', basics: 'Knows the basics', confident: 'Confident' }, advice: { diy: 'Prefers to do it themselves', maybe: 'Open to advice for big decisions', yes: 'Would like an adviser' } };
  function planCard(sums) {
    var pr = MP.prefs();
    if (!pr.onboarded) {
      return el('section', { class: 'card guide-cta', id: 'guide-cta' },
        el('div', null, el('h2', null, '👋 Let\'s personalise your planner'),
          el('p', { class: 'muted', style: { margin: 0 } }, 'Answer a few quick questions and we\'ll suggest where to start, explain things at the right level, and keep things as simple or as detailed as you like.')),
        el('a', { class: 'btn btn-primary', href: 'guide.html', id: 'start-guide' }, 'Start (2 to 4 minutes)'));
    }
    var TOOL = {}; MP_TOOLS.forEach(function (t) { TOOL[t.id] = t; });
    var steps = (pr.plan || []).filter(function (x) { return TOOL[x.tool]; });
    var ol = el('ol', { class: 'home-plan', id: 'home-plan' }, steps.map(function (x, i) {
      var done = !!sums[x.tool];
      return el('li', { class: done ? 'done' : '' }, el('span', { class: 'n', 'aria-hidden': 'true' }, done ? '✓' : String(i + 1)),
        el('span', null, el('a', { href: 'apps/' + x.tool + '/index.html' }, TOOL[x.tool].title), x.urgent && !done ? el('span', { class: 'chip danger', style: { marginInlineStart: '6px' } }, 'Urgent') : null,
          el('span', { class: 'small muted', style: { display: 'block' } }, done ? 'Saved: ' + sums[x.tool].text : x.why)));
    }));
    var doneCount = steps.filter(function (x) { return sums[x.tool]; }).length;
    return el('section', { class: 'card', id: 'your-plan', 'aria-labelledby': 'h-plan' },
      el('div', { class: 'row', style: { justifyContent: 'space-between' } }, el('h2', { id: 'h-plan', style: { margin: 0 } }, 'Your plan'),
        el('span', { class: 'small muted' }, doneCount + ' of ' + steps.length + ' steps started')),
      el('div', { class: 'progress', style: { margin: '10px 0' }, role: 'progressbar', 'aria-label': 'Plan progress', 'aria-valuemin': 0, 'aria-valuemax': steps.length, 'aria-valuenow': doneCount }, el('span', { style: { width: (steps.length ? doneCount / steps.length * 100 : 0) + '%' } })),
      ol,
      el('div', { class: 'row small' },
        el('span', { class: 'chip' }, LABELS.knowledge[pr.knowledge] || 'Knowledge not set'),
        el('span', { class: 'chip' }, pr.detail === 'detailed' ? 'Detailed view' : 'Simple view'),
        el('span', { class: 'chip' }, LABELS.advice[pr.advice] || 'Advice not set'),
        el('a', { href: 'guide.html?restart=1', id: 'redo-guide' }, 'Change my answers')),
      pr.advice === 'yes' ? MP.adviceCard('general') : null);
  }

  /* Upcoming money dates: tax year, Self Assessment, rule changes, the customer's own goals. */
  function keyDates(p, goals) {
    var now = new Date(), y = now.getFullYear(), list = [];
    function next(m, d) { var t = new Date(y, m, d); if (t < now) t = new Date(y + 1, m, d); return t; }
    list.push({ date: next(3, 5), title: 'Tax year ends', note: 'Last day to use this year\'s ISA allowance (£20,000) and pension allowances.' });
    list.push({ date: next(0, 31), title: 'Self Assessment deadline', note: 'Online tax return and payment due, if you need to file one.' });
    if (p.employment === 'self') list.push({ date: next(6, 31), title: 'Second payment on account', note: 'Self Assessment advance payment due.' });
    [[new Date(2027, 3, 6), 'Rule changes from 6 April 2027', 'Cash ISA limit falls to £12,000 for under-65s, savings tax rates rise by 2%, and unused pensions start to count for inheritance tax.'],
     [new Date(2028, 3, 6), 'Minimum pension age rises to 57', 'For most people, the earliest age to take a personal or workplace pension.']].forEach(function (c) {
      if (c[0] > now) list.push({ date: c[0], title: c[1], note: c[2] });
    });
    goals.forEach(function (g) { var d = new Date(g.date); if (d > now) list.push({ date: d, title: (g.icon || '🎯') + ' ' + g.name, note: 'Target ' + MP.money(g.target) + ' · saved ' + MP.money(g.saved || 0) }); });
    if (p.dob) {
      var spa = UK.statePensionAge(p.dob), b = new Date(p.dob), d = new Date(b.getFullYear() + Math.floor(spa), b.getMonth() + Math.round((spa % 1) * 12), b.getDate());
      if (d > now) list.push({ date: d, title: 'Your State Pension age', note: 'Check your forecast at gov.uk/check-state-pension.' });
    }
    return list.sort(function (a, b) { return a.date - b.date; });
  }
  function ics(list) {
    function dt(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
    function escIcs(t) { return String(t).replace(/[\\;,]/g, function (c) { return '\\' + c; }); }
    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Money Planner//EN', 'CALSCALE:GREGORIAN'];
    list.forEach(function (e, i) {
      var end = new Date(e.date); end.setDate(end.getDate() + 1);
      lines.push('BEGIN:VEVENT', 'UID:mp-' + dt(e.date) + '-' + i + '@money-planner', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + dt(e.date), 'DTEND;VALUE=DATE:' + dt(end),
        'SUMMARY:' + escIcs(e.title.replace(/[^\x20-\x7E£]/g, '').trim()), 'DESCRIPTION:' + escIcs(e.note),
        'BEGIN:VALARM', 'TRIGGER:-P14D', 'ACTION:DISPLAY', 'DESCRIPTION:' + escIcs(e.title), 'END:VALARM', 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function datesCard(p, goals) {
    var list = keyDates(p, goals), now = new Date();
    return el('section', { class: 'card', 'aria-labelledby': 'h-dates' }, el('h2', { id: 'h-dates' }, 'Key dates'),
      el('ul', { class: 'activity', id: 'key-dates' }, list.slice(0, 6).map(function (e) {
        var days = Math.ceil((e.date - now) / 864e5);
        return el('li', null, el('strong', null, e.title), el('span', { class: 'muted tiny' }, ' · ' + MP.fmtDate(e.date) + (days <= 60 ? ' (' + days + ' days)' : '')),
          el('div', { class: 'small muted' }, e.note));
      })),
      el('button', { class: 'btn btn-sm', type: 'button', id: 'dates-ics', style: { marginTop: '10px' }, onclick: function () {
        MP.download('money-dates.ics', ics(list), 'text/calendar'); MP.toast('Calendar file downloaded. Open it to add reminders.');
      } }, '📅 Add to my calendar'));
  }
  function reportCard() {
    return el('section', { class: 'card' }, el('h2', null, 'My money plan'),
      el('p', { class: 'small muted' }, 'One page with your details, plan, dreams and saved results. Print it or save it as a PDF' + (MP.prefs().advice === 'yes' ? ' to take to an adviser.' : ' for your records.')),
      el('a', { class: 'btn btn-sm', href: 'report.html', id: 'open-report' }, '🖨️ View and print'));
  }

  function stat(label, value, id) {
    return el('div', { class: 'card stat' }, el('span', { class: 'label' }, label), el('span', { class: 'value', id: id }, value));
  }

  function profileCard(p, age) {
    var form = el('form', { id: 'profile-form', novalidate: true });
    var name = el('input', { type: 'text', id: 'p-name', value: p.name || '', autocomplete: 'name' });
    var dob = el('input', { type: 'date', id: 'p-dob', value: p.dob || '', max: MP.isoDate(new Date()) });
    var region = el('select', { id: 'p-region' }, REGIONS.map(function (r) { return el('option', { value: r[0], selected: p.region === r[0] }, r[1]); }));
    var sal = MP.moneyInput({ id: 'p-salary', value: p.salary || '' });
    var emp = el('select', { id: 'p-employment' }, [['employed', 'Employed'], ['self', 'Self-employed'], ['retired', 'Retired'], ['other', 'Not working / other']].map(function (r) { return el('option', { value: r[0], selected: p.employment === r[0] }, r[1]); }));
    var risk = el('select', { id: 'p-risk' }, RISK.map(function (r) { return el('option', { value: r[0], selected: p.riskAttitude === r[0] }, r[1]); }));
    form.appendChild(el('div', { class: 'grid-2' },
      MP.field('Name', name), MP.field('Date of birth', dob, age != null ? 'Age ' + age : 'Used for pension ages'),
      MP.field('Where you live', region, 'Scotland has different income tax'), MP.field('Yearly salary before tax', sal.wrap),
      MP.field('Work', emp), MP.field('Attitude to investment risk', risk)));
    form.appendChild(el('button', { class: 'btn btn-primary', type: 'submit', id: 'p-save' }, 'Save'));
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = MP.vault();
      Object.assign(v.profile, { name: name.value.trim() || v.profile.name, dob: dob.value, region: region.value, salary: MP.num(sal.input.value), employment: emp.value, riskAttitude: risk.value });
      MP.set('profile', v.profile);
      MP.log('Updated your details');
      MP.toast('Your details are saved.');
      render();
    });
    return el('section', { class: 'card', 'aria-labelledby': 'h-about' }, el('h2', { id: 'h-about' }, 'About you'), form);
  }

  function accountCard() {
    var me = MP.auth.current();
    return el('section', { class: 'card' }, el('h2', null, 'Your account'),
      el('p', { class: 'small muted' }, 'Signed in as ', el('strong', null, me.email), '. Your data is encrypted on this device.'),
      el('div', { class: 'row' },
        el('button', { class: 'btn btn-sm', type: 'button', id: 'backup', onclick: function () { MP.exportData(); MP.toast('Backup downloaded. Keep it somewhere safe: it is not encrypted.'); } }, 'Download backup'),
        el('button', { class: 'btn btn-sm', type: 'button', id: 'restore', onclick: restore }, 'Import backup'),
        el('button', { class: 'btn btn-sm', type: 'button', id: 'change-pw', onclick: changePw }, 'Change password'),
        el('button', { class: 'btn btn-sm btn-danger', type: 'button', id: 'delete-acc', onclick: function () {
          if (MP.confirm('Delete your account and every plan saved in it from this device? This cannot be undone.')) MP.auth.deleteAccount();
        } }, 'Delete account')));
  }

  function restore() {
    MP.files.pick('.json,application/json').then(function (files) {
      if (!files[0]) return;
      return MP.files.text(files[0]).then(function (txt) {
        var obj; try { obj = JSON.parse(txt); } catch (e) { throw new Error('That file is not a Money Planner backup.'); }
        if (!MP.confirm('Replace everything in this account with the backup?')) return;
        MP.importData(obj); MP.log('Imported a backup'); MP.toast('Backup imported.'); render();
      });
    }).catch(function (e) { MP.toast(e.message); });
  }

  function changePw() {
    var o = el('input', { type: 'password', id: 'pw-old', autocomplete: 'current-password' });
    var n = el('input', { type: 'password', id: 'pw-new', autocomplete: 'new-password' });
    var err = el('p', { class: 'callout danger', hidden: true, role: 'alert' });
    var btn = el('button', { class: 'btn btn-primary', type: 'submit' }, 'Change password');
    var form = el('form', null, MP.field('Current password', o), MP.field('New password', n, 'At least 10 characters'), err, btn);
    var close = MP.modal(form, { title: 'Change password' });
    form.addEventListener('submit', function (e) {
      e.preventDefault(); btn.disabled = true; err.hidden = true;
      MP.auth.changePassword(o.value, n.value).then(function () { close(); MP.toast('Password changed.'); })
        .catch(function (x) { err.textContent = x.message; err.hidden = false; btn.disabled = false; });
    });
  }

  render();
});
</script>
</body>
</html>
